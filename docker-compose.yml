services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: mcpkb-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "true"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: mcpkb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcpkb
      POSTGRES_PASSWORD: mcpkb
      POSTGRES_DB: mcpkb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpkb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Required runtime graph backend.
  neo4j:
    image: neo4j:latest
    container_name: mcpkb-neo4j
    restart: unless-stopped
    environment:
      # Local development only. Set NEO4J_AUTH=neo4j/<strong-password> and
      # NEO4J_AUTH_ENABLED=true before exposing Neo4j outside this machine.
      NEO4J_AUTH: ${NEO4J_AUTH:-none}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins
      - ./backups/neo4j:/import/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Open-source, self-hosted metasearch (free, no API key). Aggregates several
  # engines server-side, avoiding the captcha/rate-limit issues of direct scraping.
  searxng:
    build:
      context: ./config/searxng
      dockerfile: Dockerfile
    container_name: mcpkb-searxng
    restart: unless-stopped
    ports:
      - "8889:8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8889/
      # More than 1 worker so concurrent harvest queries don't queue behind
      # each other and get reset by the client-side timeout.
      GRANIAN_WORKERS: "4"

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcpkb-server
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      MCP_KB_TRANSPORT: http
      MCP_KB_HTTP_HOST: 0.0.0.0
      MCP_KB_HTTP_PORT: 8000
      QDRANT_URL: http://qdrant:6333
      POSTGRES_DSN: postgresql://mcpkb:mcpkb@postgres:5432/mcpkb
      MCP_KB_REPOS_ROOT: /app/data/repos
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_AUTH_ENABLED: ${NEO4J_AUTH_ENABLED:-false}
      NEO4J_DATABASE: neo4j
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:14b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_GENERATE_URL: ${OLLAMA_GENERATE_URL:-http://host.docker.internal:11434/api/generate}
      LEARNING_ENABLED: ${LEARNING_ENABLED:-true}
      SPARSE_ENABLED: ${SPARSE_ENABLED:-true}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      WEB_SEARCH_MIN_CONFIDENCE: ${WEB_SEARCH_MIN_CONFIDENCE:-0.45}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  qdrant_data:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

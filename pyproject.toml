[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-microservices-kb"
version = "1.0.0"
description = "Centralized MCP knowledge engine for a Spring Boot microservice ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Platform Engineering" }]

dependencies = [
    "fastmcp>=2.3.0",
    "langgraph>=0.2.40",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "qdrant-client>=1.11.0",
    "sentence-transformers>=3.0.0",
    "fastembed>=0.3.6",
    "tree-sitter>=0.23.0",
    "tree-sitter-java>=0.23.0",
    # Phase 4: generic multi-language extraction engine — prebuilt grammars for
    # Python/Go/TypeScript/JavaScript/C#/etc (single package, no per-language pins).
    "tree-sitter-language-pack>=1.16.0",
    "GitPython>=3.1.43",
    "PyYAML>=6.0.2",
    "lxml>=5.3.0",
    # Phase 6: XXE-hardened XML parsing for untrusted repo manifests (tech_detector.py).
    "defusedxml>=0.7.1",
    "psycopg[binary]>=3.2.0",
    "SQLAlchemy>=2.0.35",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "rich>=13.9.0",
    "networkx>=3.4",
    "truststore>=0.9.0",
    # documentation harvester
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "rapidfuzz>=3.9.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
# Enterprise graph store: enables GRAPH_BACKEND=neo4j (see
# graph/neo4j_store.py, scripts/migrate_graph_to_neo4j.py). Not required for
# the default NetworkX backend.
neo4j = [
    "neo4j>=5.24.0",
]
# OpenTelemetry tracing/metrics export: enables OTEL_ENABLED=true with a real
# exporter. Without this extra, OTEL_ENABLED=true logs a warning and falls
# back to structlog-only latency tracking (see observability/tracing.py).
otel = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
]
# LLM-specific observability (prompts/completions/latency/cost): enables
# LANGFUSE_ENABLED=true (see observability/langfuse_tracing.py). Self-hosted
# or cloud Langfuse both work via LANGFUSE_HOST.
langfuse = [
    "langfuse>=2.50.0",
]
# Optional Given/When/Then story parsing; regex fallback is always available.
nlp = [
    "spacy>=3.8.0",
]
# Everything above — convenience for a full production deployment.
enterprise = [
    "mcp-microservices-kb[neo4j,otel,langfuse]",
]
# Phase 6: security tooling (SAST + fuzz/property testing) — dev-only, not
# needed at runtime. `pip install -e ".[security]"` to run scripts/security_audit.py.
security = [
    "bandit>=1.9.0",
    "hypothesis>=6.100.0",
]

[project.scripts]
mcp-kb-server = "mcp_kb.server:main"
mcp-kb-ingest = "mcp_kb.ingestion.pipeline:cli_main"
mcp-kb-refresh = "mcp_kb.ingestion.pipeline:cli_refresh"
mcp-kb-rewrite = "mcp_kb.ingestion.full_rewrite:cli_rewrite"
mcp-kb-enrich = "mcp_kb.ingestion.llm_enrichment:cli_main"
mcp-kb-build-all = "mcp_kb.ingestion.build_all:cli_build_all"
mcp-kb-eval = "mcp_kb.eval.cli:main"
mcp-kb-eval-perf = "mcp_kb.eval.cli_perf:main"
mcp-kb-ui = "mcp_kb.ui.graph_viewer:main"
mcp-kb-install-agents = "mcp_kb.discover.agent_config:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
